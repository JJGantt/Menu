name: Menu
options:
  bundleIdPrefix: com.jaredgantt
  deploymentTarget:
    iOS: 16.0
    watchOS: 11.0
settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: XMH4AVFC78
    CODE_SIGN_STYLE: Automatic
targets:
  Menu:
    type: application
    platform: iOS
    sources:
      - path: MenuApp
      # The data fetched at build time (scripts/seed.sh; only .gitkeep is committed): what a fresh
      # install shows before its first fetch. Empty, the app starts empty until one lands.
      - path: Seed
        type: folder
        buildPhase: resources
    info:
      path: MenuApp/Info.plist
      properties:
        CFBundleDisplayName: Menu
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UIStatusBarStyle: UIStatusBarStyleDarkContent
        UILaunchScreen: {}
        CFBundleIconName: AppIcon
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: Lets you ask questions and add items by voice.
        NSSpeechRecognitionUsageDescription: Transcribes your voice into questions for the assistant.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaredgantt.CapitalGrille
        PRODUCT_NAME: Menu
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "44"
    dependencies:
      - target: MenuWatch
        embed: true

  MenuWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: MenuWatch
      - path: MenuApp/Secrets.swift
      - path: MenuApp/SupabaseClient.swift
      - path: MenuApp/RestockModels.swift
      - path: MenuApp/MenuModels.swift
      - path: MenuApp/CocktailModels.swift
      - path: MenuApp/ConfigModels.swift
      - path: MenuApp/WineModels.swift
      - path: MenuApp/AnthropicClient.swift
      - path: MenuApp/AppLogger.swift
      - path: MenuApp/APIKeyStore.swift
      - path: MenuApp/ChatEngine.swift
      - path: MenuApp/Orders.swift
      - path: Seed
        type: folder
        buildPhase: resources
      - path: MenuWatchWidgets/OpenAppIntent.swift
    info:
      path: MenuWatch/Info.plist
      properties:
        CFBundleDisplayName: Menu
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        CFBundleIconName: AppIcon
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.jaredgantt.CapitalGrille
        NSMicrophoneUsageDescription: Voice prompts to the AI assistant.
        # Audio is what keeps a watch app running with the wrist down: the recording itself, and the
        # microphone StayAwake holds while an answer is on its way (MenuWatch/StayAwake.swift).
        UIBackgroundModes:
          - audio
        # menuapp://record is what the complication opens. Unregistered, the tap still opens the
        # app but onOpenURL never receives the URL, so no recording starts.
        CFBundleURLTypes:
          - CFBundleURLName: com.jaredgantt.CapitalGrille.watch
            CFBundleURLSchemes:
              - menuapp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaredgantt.CapitalGrille.watch
        TARGETED_DEVICE_FAMILY: "4"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "44"
    dependencies:
      - target: MenuWatchWidgets
        embed: true

  MenuWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: MenuWatchWidgets
    info:
      path: MenuWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Menu
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaredgantt.CapitalGrille.watch.widgets
        TARGETED_DEVICE_FAMILY: "4"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "44"
